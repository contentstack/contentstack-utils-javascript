name: Publish package to npmjs registry
on:
  release:
    types: [published]

jobs:
  publish-npm:
    if: ${{ startsWith(github.event.release.tag_name, 'v') && !github.event.release.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: 'npm'
      - run: npm ci
      - name: Update npm
        run: npm install -g npm@latest
      - name: Release
        run: npm publish --access public --tag ${{ github.event.release.prerelease && 'beta' || 'latest' }}

  publish-github:
    if: ${{ startsWith(github.event.release.tag_name, 'v') && !github.event.release.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com/
          cache: 'npm'
      - run: npm ci
      - name: Update npm
        run: npm install -g npm@latest
      - name: Release
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
